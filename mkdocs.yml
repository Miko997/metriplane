# The repository retains detailed technical, evaluation, and frozen-reproduction
# documents outside the first-time-user site. Their source remains available on
# GitHub; excluding them keeps this strict build focused on the curated front door.
exclude_docs: |
  *.md
  !README.md
  !user-guide/
  !user-guide/**
  !specs/external-source-contract-v1.md
  !specs/external-source-contract-v1-audit.md
  archive/**
  atlas/**
  benchmarks/**
  case-studies/**
  eval/**
  paper/**
  qa/**
  references/**
  releases/**
  reports/**
  review_kit/**
  validation/human-comprehension-results.json
