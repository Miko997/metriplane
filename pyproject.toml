[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metriplane"
dynamic = ["version"]
description = "Turn recorded workcell state into incident reports, verified evidence, and repeatable robotics regression checks."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Miko Parkkinen" },
]
keywords = [
  "robotics",
  "robotics testing",
  "incident analysis",
  "replay",
  "regression testing",
  "reproducibility",
  "workcells",
  "simulation",
  "digital twins",
  "industrial automation",
  "physical observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.8",
  "PyYAML>=6.0",
  "websockets>=12.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://www.metriplane.com/"
Documentation = "https://github.com/Miko997/metriplane/blob/main/docs/README.md"
Repository = "https://github.com/Miko997/metriplane"
Issues = "https://github.com/Miko997/metriplane/issues"
Changelog = "https://github.com/Miko997/metriplane/blob/main/CHANGELOG.md"
Support = "https://github.com/Miko997/metriplane/blob/main/SUPPORT.md"
Roadmap = "https://github.com/Miko997/metriplane/blob/main/ROADMAP.md"
"Research Artifact v0.2.0" = "https://doi.org/10.5281/zenodo.20736619"
"Research Preprint" = "https://doi.org/10.2139/ssrn.7166858"

[project.optional-dependencies]
gpu-cuda12x = [
  "cupy-cuda12x>=13.0.0; platform_system=='Linux'",
]

gpu-cuda13x = [
  "cupy-cuda13x>=13.0.0; platform_system=='Linux'",
  # Optional but makes CUDA13 usable without system toolkit:
  "cuda-toolkit>=13.0.0; platform_system=='Linux'",
]

# Keep gpu as a “meta” that doesn't force the wrong CUDA version:
gpu = []

plots = [
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:ament_pep257 -p no:ament_flake8 -p no:ament_copyright -p no:ament_xmllint -p no:ament_lint"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "metriplane.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["metriplane*", "integrations*"]
exclude = ["integrations.ros2*"]

[tool.setuptools.package-data]
"metriplane.demo" = [
  "assets/*.jsonl",
  "assets/assembly_cell/*.yaml",
  "assets/assembly_cell/*.csv",
]

[project.scripts]
metriplane = "metriplane.cli:main"
metriplane-run = "metriplane.run:main"
