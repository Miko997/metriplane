[project]
name = "metriplane"
version = "0.1.4"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "websockets>=12.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
gpu-cuda12x = [
  "cupy-cuda12x>=13.0.0; platform_system=='Linux'",
]

gpu-cuda13x = [
  "cupy-cuda13x>=13.0.0; platform_system=='Linux'",
  # Optional but makes CUDA13 usable without system toolkit:
  "cuda-toolkit>=13.0.0; platform_system=='Linux'",
]

# Keep gpu as a “meta” that doesn't force the wrong CUDA version:
gpu = []

plots = [
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:ament_pep257 -p no:ament_flake8 -p no:ament_copyright -p no:ament_xmllint -p no:ament_lint"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["metriplane*"]

[project.scripts]
metriplane = "metriplane.cli:main"
metriplane-run = "metriplane.run:main"
