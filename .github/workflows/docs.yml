name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tests/test_docs_front_door.py"
      - "tests/test_human_comprehension_gate.py"
      - "scripts/summarize_human_comprehension.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tests/test_docs_front_door.py"
      - "tests/test_human_comprehension_gate.py"
      - "scripts/summarize_human_comprehension.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install "mkdocs>=1.6,<2" PyYAML pytest
      - name: Check documentation and manual-gate tooling
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/test_docs_front_door.py
          tests/test_human_comprehension_gate.py
      - name: Build documentation strictly
        run: python -m mkdocs build --strict --site-dir /tmp/metriplane-docs-site
