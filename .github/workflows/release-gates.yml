name: Release Gates

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - feature/release-v0.2.0

permissions:
  contents: read

jobs:
  fixture-integrity:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Check required release fixtures
        run: |
          python -m pytest -q tests/test_release_fixture_integrity.py

      - name: Confirm required fixture files are tracked
        run: |
          git ls-files tests/fixtures benchmarks/physical_observability evidence/incidents/INC-0001 evidence/incidents/INC-DIST-001 datasets/demo/atlas | sort
          test -n "$(git ls-files tests/fixtures/contracts/sentinel_minimal_session.jsonl)"
          test -n "$(git ls-files tests/fixtures/camera_trust/multicam_session.jsonl)"
          test -n "$(git ls-files benchmarks/physical_observability/scenarios/blocked_path_001/input_session.jsonl)"
          test -n "$(git ls-files evidence/incidents/INC-0001/session_excerpt.jsonl)"

  ui-static:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Check dashboard JavaScript syntax
        run: |
          for f in web/dashboard/*.js; do node --check "$f"; done

      - name: Run static UI audit
        run: |
          python tools/audit_ui_functionality.py \
            --out /tmp/metriplane_ui_coverage_latest.csv \
            --json /tmp/metriplane_ui_coverage_latest.json \
            --no-docs

      - name: Run UI API and static integrity tests
        run: |
          python -m pytest -q tests/ui_api tests/ui_coverage

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest playwright
          python -m playwright install chromium --with-deps

      - name: Run browser smoke
        run: |
          python -m pytest -q tests/e2e

  wheel_smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel in fresh venv outside checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          smoke_venv="${RUNNER_TEMP}/metriplane-wheel-smoke"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --upgrade pip
          "$smoke_venv/bin/python" -m pip install "$wheel_path"
          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/python" -m pip check
          "$smoke_venv/bin/metriplane" doctor
          "$smoke_venv/bin/metriplane" atlas protocol export --out protocol-smoke
          test -s protocol-smoke/open_atlas_protocol_index.json
          "$smoke_venv/bin/python" -c "import cv2; assert hasattr(cv2, 'aruco')"
          "$smoke_venv/bin/python" -c "import importlib.metadata as md, metriplane; assert metriplane.__version__ == md.version('metriplane')"
          "$smoke_venv/bin/python" -c "import integrations.isaac.metriplane_to_usd"
          "$smoke_venv/bin/python" -c "import integrations.omniverse.metriplane_usd_replay"
          demo_out="${RUNNER_TEMP}/metriplane-demo-smoke"
          SMOKE_VENV="$smoke_venv" DEMO_OUT="$demo_out" "$smoke_venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          command = [
              str(Path(os.environ["SMOKE_VENV"]) / "bin" / "metriplane"),
              "demo",
              "--out",
              os.environ["DEMO_OUT"],
          ]
          subprocess.run(command, check=True, timeout=120)
          PY
          test -s "$demo_out/cell_truth_report.html"
          test -s "$demo_out/evidence_bundles/INC-0001.zip"
          test -s "$demo_out/regression_tests/INC-0001.yaml"
          "$smoke_venv/bin/metriplane" atlas bundle verify \
            "$demo_out/evidence_bundles/INC-0001.zip" | grep -q '"pass": true'
          "$smoke_venv/bin/metriplane" atlas test \
            "$demo_out/regression_tests/INC-0001.yaml" --json | grep -q '"pass": true'

  package-smoke:
    name: package-smoke
    if: ${{ always() }}
    needs: wheel_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every wheel smoke job to pass
        env:
          WHEEL_SMOKE_RESULT: ${{ needs.wheel_smoke.result }}
        run: test "$WHEEL_SMOKE_RESULT" = "success"

  evidence-audit:
    runs-on: ubuntu-latest
    env:
      METRIPLANE_V020_TAG: "v0.2.0"
      METRIPLANE_V020_COMMIT: "8e35ed5bb20837f7dc46354777407b848d7ce17a"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify current copies of frozen v0.2.0 evidence payload
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${METRIPLANE_V020_TAG}^{commit}")"
          if [[ "$tag_commit" != "$METRIPLANE_V020_COMMIT" ]]; then
            echo "${METRIPLANE_V020_TAG} resolves to $tag_commit, expected $METRIPLANE_V020_COMMIT" >&2
            exit 1
          fi

          expected_files="$(mktemp)"
          current_files="$(mktemp)"
          frozen_checksums="$(mktemp)"
          cleanup() {
            rm -f "$expected_files" "$current_files" "$frozen_checksums"
          }
          trap cleanup EXIT

          git ls-tree -r --name-only "$METRIPLANE_V020_COMMIT" \
            -- evidence/paper_v2_0 \
            | grep -v '^evidence/paper_v2_0/README.md$' \
            | LC_ALL=C sort > "$expected_files"
          git ls-files -- evidence/paper_v2_0 \
            | grep -v '^evidence/paper_v2_0/README.md$' \
            | LC_ALL=C sort > "$current_files"
          test -s "$expected_files"
          test -s "$current_files"

          if ! diff -u "$expected_files" "$current_files"; then
            echo "Tracked evidence/paper_v2_0 file set differs from frozen v0.2.0 release" >&2
            exit 1
          fi

          # Freeze the approved current copies of evidence inventory metadata.
          # The exact-tag step below independently verifies the archived copies.
          while read -r expected_sha inventory_path; do
            if ! git ls-files --error-unmatch -- "$inventory_path" >/dev/null; then
              echo "Frozen evidence inventory is missing or untracked: $inventory_path" >&2
              exit 1
            fi
            current_sha="$(sha256sum "$inventory_path" | awk '{print $1}')"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "Frozen evidence inventory changed: $inventory_path" >&2
              echo "expected sha256: $expected_sha" >&2
              echo "current sha256:  $current_sha" >&2
              exit 1
            fi
          done <<'INVENTORY_SHA256'
          d7c2f2b2caa215901aeb8d92772fe277a454f0c5e15f1152c27fd064177850ad evidence/CHECKSUMS.sha256
          22d1a8731e80c1d8b141ea95e7ce65d4edc37a97b84ece66740d78bed21b47d9 evidence/manifest.csv
          e9b50087fc6ec961bfa089771604c77d6d411c092f44d306306b80852f3c04a6 evidence/paper_v2_0/CHECKSUMS.sha256
          INVENTORY_SHA256

          git show "${METRIPLANE_V020_COMMIT}:evidence/paper_v2_0/CHECKSUMS.sha256" \
            | awk '$2 != "evidence/paper_v2_0/README.md"' \
            > "$frozen_checksums"
          test -s "$frozen_checksums"

          # The paper-evidence README is documentation and may be maintained on main.
          # Every other path in the archived checksum list is frozen evidence payload.
          sha256sum -c "$frozen_checksums" --quiet

      - name: Verify archived v0.2.0 release tree
        shell: bash
        run: |
          set -euo pipefail
          worktree_parent="$(mktemp -d)"
          archive_tree="$worktree_parent/v0.2.0"
          cleanup() {
            git worktree remove --force "$archive_tree" >/dev/null 2>&1 || true
            rm -rf "$worktree_parent"
          }
          trap cleanup EXIT

          git worktree add --detach "$archive_tree" "$METRIPLANE_V020_COMMIT"
          (
            cd "$archive_tree"
            test "$(git rev-parse HEAD)" = "$METRIPLANE_V020_COMMIT"
            sha256sum -c evidence/CHECKSUMS.sha256 --quiet
            python scripts/audit_evidence.py
          )

  ros2-adapter-static:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Check ROS 2 adapter package structure
        run: |
          python tools/check_ros2_adapters.py
          python -m pytest -q tests/test_ros2_packaging.py tests/test_ros2_msg_adapters.py
