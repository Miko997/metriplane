name: Release Gates

on:
  workflow_call:
    inputs:
      enforce-release-decision:
        description: "Fail when a valid registry contains an unresolved release blocker"
        required: true
        type: boolean
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches:
      - main
      - feature/release-v0.2.0

permissions:
  contents: read
  pull-requests: read

jobs:
  fixture-integrity:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked test environment
        run: uv sync --locked --group dev

      - name: Check required release fixtures
        run: |
          uv run python -m pytest -q tests/test_release_fixture_integrity.py

      - name: Enforce release blocker policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          context_args=(--github-repository "$GITHUB_REPOSITORY")
          decision_args=()
          if [[ "${{ inputs.enforce-release-decision }}" != "true" ]]; then
            decision_args+=(--validation-only)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "pull_request_review" ]]; then
            context_args+=(
              --github-pull-request "${{ github.event.pull_request.number }}"
              --github-change-sha "${{ github.event.pull_request.head.sha }}"
              --github-base-sha "${{ github.event.pull_request.base.sha }}"
              --validated-sha "${{ github.event.pull_request.head.sha }}"
            )
          else
            history_base="$(git rev-parse "${GITHUB_SHA}^")"
            context_args+=(
              --github-base-sha "$history_base"
              --validated-sha "$GITHUB_SHA"
              --require-merged-approval
            )
          fi
          uv run python tools/check_blockers.py \
            --registry docs/status/blockers.json \
            --schema schemas/metriplane.blockers.v1.schema.json \
            --repo-root . \
            "${context_args[@]}" \
            "${decision_args[@]}" \
            --json
          uv run python -m pytest -q tests/test_blocker_workflow.py

      - name: Confirm required fixture files are tracked
        run: |
          git ls-files tests/fixtures benchmarks/physical_observability evidence/incidents/INC-0001 evidence/incidents/INC-DIST-001 datasets/demo/atlas | sort
          test -n "$(git ls-files tests/fixtures/contracts/sentinel_minimal_session.jsonl)"
          test -n "$(git ls-files tests/fixtures/camera_trust/multicam_session.jsonl)"
          test -n "$(git ls-files benchmarks/physical_observability/scenarios/blocked_path_001/input_session.jsonl)"
          test -n "$(git ls-files evidence/incidents/INC-0001/session_excerpt.jsonl)"

  ui-static:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked test environment
        run: uv sync --locked --group dev

      - name: Check dashboard JavaScript syntax
        run: |
          for f in web/dashboard/*.js; do node --check "$f"; done

      - name: Run static UI audit
        run: uv run python tools/audit_ui_functionality.py --check

      - name: Run UI API and static integrity tests
        run: |
          uv run python -m pytest -q tests/ui_api tests/ui_coverage

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked browser environment
        run: uv sync --locked --group dev

      - name: Install Chromium for browser E2E
        run: uv run python -m playwright install chromium --with-deps

      - name: Run browser smoke
        run: |
          uv run python -m pytest -q tests/e2e

  wheel_smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked build environment
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Build source and wheel distributions
        run: |
          uv run --python ${{ matrix.python-version }} python -m build
          python - <<'PY'
          from pathlib import Path

          artifacts = sorted(path for path in Path("dist").iterdir() if path.is_file())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith((".tar.gz", ".zip"))]
          if len(wheels) != 1 or len(sdists) != 1 or len(artifacts) != 2:
              raise SystemExit(
                  "Expected exactly one wheel and one source distribution; found: "
                  + ", ".join(path.name for path in artifacts)
              )
          PY
          uv run --python ${{ matrix.python-version }} python -m twine check --strict dist/*

      - name: Install wheel in fresh venv outside checkout
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(uv run --python ${{ matrix.python-version }} python -c 'import metriplane; print(metriplane.__version__)')"
          wheel_path="$(uv run --python ${{ matrix.python-version }} python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          smoke_venv="${RUNNER_TEMP}/metriplane-wheel-smoke"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install "$wheel_path"
          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/python" -m pip check
          test "$("$smoke_venv/bin/metriplane" --version)" = "metriplane ${package_version}"
          unrelated_repo="${RUNNER_TEMP}/unrelated-git-checkout"
          mkdir -p "$unrelated_repo"
          git -C "$unrelated_repo" init -q
          cd "$unrelated_repo"
          doctor_output="$("$smoke_venv/bin/metriplane" doctor)"
          printf '%s\n' "$doctor_output"
          grep -Fxq "Installation: installed distribution" <<<"$doctor_output"
          grep -Fxq "Ready for the bundled camera-free demo." <<<"$doctor_output"
          if grep -q "Git commit" <<<"$doctor_output"; then
            echo "Installed-wheel doctor inspected an unrelated Git checkout" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/python" - <<'PY'
          from importlib import metadata, resources

          expected = {
              "assets/assembly_cell_missing_tool.jsonl",
              "assets/assembly_cell/assets.yaml",
              "assets/assembly_cell/contracts.yaml",
              "assets/assembly_cell/process.yaml",
              "assets/assembly_cell/work_orders.csv",
              "assets/assembly_cell/workspace.yaml",
          }
          distribution_paths = {
              str(path) for path in (metadata.files("metriplane") or ())
          }
          expected_distribution_paths = {
              f"metriplane/demo/{path}" for path in expected
          }
          packaged_demo_assets = {
              path
              for path in distribution_paths
              if path.startswith("metriplane/demo/assets/")
          }
          assert packaged_demo_assets == expected_distribution_paths

          package_root = resources.files("metriplane.demo")
          missing = sorted(
              path for path in expected if not package_root.joinpath(path).is_file()
          )
          assert not missing, f"missing bundled demo resources: {missing}"
          PY
          "$smoke_venv/bin/metriplane" atlas protocol export --out protocol-smoke
          test -s protocol-smoke/open_atlas_protocol_index.json
          "$smoke_venv/bin/python" -c "import cv2; assert hasattr(cv2, 'aruco')"
          "$smoke_venv/bin/python" -c "import importlib.metadata as md, metriplane; assert metriplane.__version__ == md.version('metriplane')"
          "$smoke_venv/bin/python" -c "import integrations.isaac.metriplane_to_usd"
          "$smoke_venv/bin/python" -c "import integrations.omniverse.metriplane_usd_replay"
          "$smoke_venv/bin/python" -c "import importlib.metadata as md; assert all(not str(path).startswith('integrations/ros2/') for path in (md.files('metriplane') or []))"
          smoke_workspace="${RUNNER_TEMP}/metriplane-quickstart-smoke"
          browser_stub="${RUNNER_TEMP}/metriplane-browser-stub"
          browser_uri_file="${RUNNER_TEMP}/metriplane-browser-uri.txt"
          mkdir -p "$smoke_workspace"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            ': "${METRIPLANE_BROWSER_URI_FILE:?}"' \
            'printf "%s\\n" "$1" > "$METRIPLANE_BROWSER_URI_FILE"' \
            > "$browser_stub"
          chmod +x "$browser_stub"
          METRIPLANE_BROWSER_URI_FILE="$browser_uri_file" \
            BROWSER="$browser_stub" \
            SMOKE_VENV="$smoke_venv" \
            SMOKE_WORKSPACE="$smoke_workspace" \
            "$smoke_venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          command = [
              str(Path(os.environ["SMOKE_VENV"]) / "bin" / "metriplane"),
              "demo",
              "--open",
          ]
          completed = subprocess.run(
              command,
              check=True,
              cwd=os.environ["SMOKE_WORKSPACE"],
              timeout=120,
              text=True,
              capture_output=True,
          )
          print(completed.stdout, end="")
          print(completed.stderr, end="", file=sys.stderr)
          if "Browser: open request sent" not in completed.stdout:
              raise RuntimeError("installed-wheel demo did not dispatch its report URI")
          PY
          demo_out="$smoke_workspace/metriplane-demo"
          test -s "$demo_out/cell_truth_report.html"
          test -s "$demo_out/evidence_bundles/INC-0001.zip"
          test -s "$demo_out/regression_tests/INC-0001.yaml"
          expected_report_uri="$(REPORT_PATH="$demo_out/cell_truth_report.html" "$smoke_venv/bin/python" -c 'import os; from pathlib import Path; print(Path(os.environ["REPORT_PATH"]).resolve().as_uri())')"
          test "$(<"$browser_uri_file")" = "$expected_report_uri"
          "$smoke_venv/bin/metriplane" atlas bundle verify \
            "$demo_out/evidence_bundles/INC-0001.zip" | grep -q '"pass": true'
          "$smoke_venv/bin/metriplane" atlas test \
            "$demo_out/regression_tests/INC-0001.yaml" --json | grep -q '"pass": true'

          exported_inputs="${RUNNER_TEMP}/metriplane-example-inputs"
          exported_run="${RUNNER_TEMP}/metriplane-example-run"
          "$smoke_venv/bin/metriplane" demo --export-inputs "$exported_inputs"
          test -s "$exported_inputs/session.jsonl"
          test -s "$exported_inputs/domain-pack/assets.yaml"
          test -s "$exported_inputs/domain-pack/workspace.yaml"
          test -s "$exported_inputs/domain-pack/process.yaml"
          test -s "$exported_inputs/domain-pack/contracts.yaml"
          test -s "$exported_inputs/domain-pack/work_orders.csv"
          "$smoke_venv/bin/metriplane" atlas validate-pack \
            "$exported_inputs/domain-pack" | grep -Fq "PASS"
          exported_run_output="$("$smoke_venv/bin/metriplane" atlas run \
            --session-jsonl "$exported_inputs/session.jsonl" \
            --pack "$exported_inputs/domain-pack" \
            --out "$exported_run")"
          printf '%s\n' "$exported_run_output"
          grep -Fq "events=6 incidents=1" <<<"$exported_run_output"
          report_path="$("$smoke_venv/bin/metriplane" atlas report \
            --run-dir "$exported_run")"
          test "$report_path" = "$exported_run/cell_truth_report.html"
          test -s "$report_path"
          "$smoke_venv/bin/metriplane" atlas bundle verify \
            "$exported_run/evidence_bundles/INC-0001.zip" | grep -q '"pass": true'
          "$smoke_venv/bin/metriplane" atlas test \
            "$exported_run/regression_tests/INC-0001.yaml" --json | grep -q '"pass": true'

          external_fixture="${RUNNER_TEMP}/metriplane-external-fixture"
          external_run="${RUNNER_TEMP}/metriplane-external-run"
          external_validation_json="${RUNNER_TEMP}/metriplane-external-validation.json"
          external_run_json="${RUNNER_TEMP}/metriplane-external-run.json"
          external_fixture_fingerprint="${RUNNER_TEMP}/metriplane-external-fixture.sha256"
          expected_metriplane_git_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$expected_metriplane_git_commit" = \
            "${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_FIXTURE="$GITHUB_WORKSPACE/examples/external_sources/minimal" \
            EXTERNAL_FIXTURE="$external_fixture" \
            FINGERPRINT_FILE="$external_fixture_fingerprint" \
            "$smoke_venv/bin/python" - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil

          source = Path(os.environ["SOURCE_FIXTURE"])
          fixture = Path(os.environ["EXTERNAL_FIXTURE"])
          shutil.copytree(source, fixture)

          digest = hashlib.sha256()
          for path in sorted(fixture.rglob("*")):
              if path.is_symlink():
                  raise RuntimeError(f"external smoke fixture contains a symlink: {path}")
              relative = path.relative_to(fixture).as_posix().encode("utf-8")
              if path.is_dir():
                  digest.update(b"directory\0")
                  digest.update(relative)
                  digest.update(b"\0")
              elif path.is_file():
                  digest.update(b"file\0")
                  digest.update(relative)
                  digest.update(b"\0")
                  digest.update(path.read_bytes())
                  digest.update(b"\0")
              else:
                  raise RuntimeError(f"external smoke fixture has an unsafe path: {path}")
          Path(os.environ["FINGERPRINT_FILE"]).write_text(
              digest.hexdigest() + "\n", encoding="utf-8"
          )
          PY

          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/metriplane" external validate \
            "$external_fixture" --json > "$external_validation_json"
          VALIDATION_JSON="$external_validation_json" \
            EXTERNAL_FIXTURE="$external_fixture" \
            "$smoke_venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["VALIDATION_JSON"]).read_text(encoding="utf-8"))
          assert result["pass"] is True
          assert result["fixture_id"] == "synthetic-inspection-bench-v1"
          assert Path(result["fixture_root"]).resolve() == Path(
              os.environ["EXTERNAL_FIXTURE"]
          ).resolve()
          assert result["contract_schema_version"] == (
              "metriplane.external_source_contract.v1"
          )
          assert result["contract_profile"] == (
              "metriplane.atlas.complete_snapshot.v1"
          )
          assert result["frame_state_model_version"] == "1.0"
          assert result["frame_count"] == 4
          assert result["normalized_object_count"] == 2
          assert result["source_entity_count"] == 2
          assert result["errors"] == []
          PY

          METRIPLANE_GIT_COMMIT="$expected_metriplane_git_commit" \
            "$smoke_venv/bin/metriplane" external run \
            "$external_fixture" \
            --out "$external_run" \
            --run-id installed_wheel_external_fixture \
            --json > "$external_run_json"
          RUN_JSON="$external_run_json" \
            EXTERNAL_RUN="$external_run" \
            EXTERNAL_FIXTURE="$external_fixture" \
            METRIPLANE_GIT_COMMIT="$expected_metriplane_git_commit" \
            "$smoke_venv/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          summary = json.loads(Path(os.environ["RUN_JSON"]).read_text(encoding="utf-8"))
          run = Path(os.environ["EXTERNAL_RUN"])
          assert summary["pass"] is True
          assert summary["fixture_id"] == "synthetic-inspection-bench-v1"
          assert summary["validation"]["pass"] is True
          assert summary["run_id"] == "installed_wheel_external_fixture"
          assert Path(summary["output_directory"]).resolve() == run.resolve()
          assert summary["frame_count"] == 4
          assert summary["event_count"] == 5
          assert summary["deviation_count"] == 1
          assert summary["incident_count"] == 1
          assert summary["errors"] == []

          report = Path(summary["report_path"])
          assert report.is_file()
          assert "<h2>External fixture provenance</h2>" in report.read_text(
              encoding="utf-8"
          )

          provenance = summary["provenance"]
          provenance_path = Path(provenance["path"])
          assert provenance_path == run / "external_source_provenance.json"
          assert provenance_path.is_file()
          assert hashlib.sha256(provenance_path.read_bytes()).hexdigest() == provenance["sha256"]
          provenance_record = json.loads(provenance_path.read_text(encoding="utf-8"))
          evaluation = provenance_record["evaluation"]
          assert evaluation["actual_metriplane_git_commit"] == os.environ[
              "METRIPLANE_GIT_COMMIT"
          ]
          assert evaluation["command"] == [
              "metriplane",
              "external",
              "run",
              "<fixture>",
              "--out",
              "<output>",
              "--run-id",
              "installed_wheel_external_fixture",
          ]
          serialized_provenance = json.dumps(provenance_record, sort_keys=True)
          assert str(Path(os.environ["EXTERNAL_FIXTURE"]).resolve()) not in serialized_provenance
          assert str(run.resolve()) not in serialized_provenance
          assert "repo_root" not in serialized_provenance

          assert len(summary["evidence_bundles"]) == 1
          evidence = summary["evidence_bundles"][0]
          assert evidence["verified"] is True
          assert evidence["errors"] == []
          evidence_path = Path(evidence["path"])
          assert evidence_path.is_file()
          with zipfile.ZipFile(evidence_path) as archive:
              assert "provenance/external_source_provenance.json" in archive.namelist()
              bundled_provenance = json.loads(
                  archive.read("provenance/external_source_provenance.json")
              )
          assert bundled_provenance == provenance_record
          assert bundled_provenance["evaluation"][
              "actual_metriplane_git_commit"
          ] == os.environ["METRIPLANE_GIT_COMMIT"]
          serialized_bundled_provenance = json.dumps(
              bundled_provenance,
              sort_keys=True,
          )
          assert str(Path(os.environ["EXTERNAL_FIXTURE"]).resolve()) not in (
              serialized_bundled_provenance
          )
          assert str(run.resolve()) not in serialized_bundled_provenance
          assert "repo_root" not in serialized_bundled_provenance

          assert len(summary["generated_regressions"]) == 1
          regression = summary["generated_regressions"][0]
          assert regression["passed"] is True
          assert regression["errors"] == []
          assert Path(regression["path"]).is_file()
          PY

          external_bundle="$external_run/evidence_bundles/INC-0001.zip"
          external_regression="$external_run/regression_tests/INC-0001.yaml"
          "$smoke_venv/bin/metriplane" atlas bundle verify \
            "$external_bundle" | grep -q '"pass": true'
          "$smoke_venv/bin/metriplane" atlas test \
            "$external_regression" --json | grep -q '"pass": true'

          EXTERNAL_FIXTURE="$external_fixture" \
            FINGERPRINT_FILE="$external_fixture_fingerprint" \
            "$smoke_venv/bin/python" - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          fixture = Path(os.environ["EXTERNAL_FIXTURE"])
          digest = hashlib.sha256()
          for path in sorted(fixture.rglob("*")):
              if path.is_symlink():
                  raise RuntimeError(f"external smoke fixture gained a symlink: {path}")
              relative = path.relative_to(fixture).as_posix().encode("utf-8")
              if path.is_dir():
                  digest.update(b"directory\0")
                  digest.update(relative)
                  digest.update(b"\0")
              elif path.is_file():
                  digest.update(b"file\0")
                  digest.update(relative)
                  digest.update(b"\0")
                  digest.update(path.read_bytes())
                  digest.update(b"\0")
              else:
                  raise RuntimeError(f"external smoke fixture has an unsafe path: {path}")
          expected = Path(os.environ["FINGERPRINT_FILE"]).read_text(
              encoding="utf-8"
          ).strip()
          assert digest.hexdigest() == expected, "external fixture changed during validation/run"
          PY

  package-smoke:
    name: package-smoke
    if: ${{ always() }}
    needs: wheel_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every wheel smoke job to pass
        env:
          WHEEL_SMOKE_RESULT: ${{ needs.wheel_smoke.result }}
        run: test "$WHEEL_SMOKE_RESULT" = "success"

  evidence-audit:
    runs-on: ubuntu-latest
    env:
      METRIPLANE_V020_TAG: "v0.2.0"
      METRIPLANE_V020_COMMIT: "8e35ed5bb20837f7dc46354777407b848d7ce17a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked audit environment
        run: uv sync --locked --group dev

      - name: Verify current copies of frozen v0.2.0 evidence payload
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${METRIPLANE_V020_TAG}^{commit}")"
          if [[ "$tag_commit" != "$METRIPLANE_V020_COMMIT" ]]; then
            echo "${METRIPLANE_V020_TAG} resolves to $tag_commit, expected $METRIPLANE_V020_COMMIT" >&2
            exit 1
          fi

          expected_files="$(mktemp)"
          current_files="$(mktemp)"
          frozen_checksums="$(mktemp)"
          cleanup() {
            rm -f "$expected_files" "$current_files" "$frozen_checksums"
          }
          trap cleanup EXIT

          git ls-tree -r --name-only "$METRIPLANE_V020_COMMIT" \
            -- evidence/paper_v2_0 \
            | grep -v '^evidence/paper_v2_0/README.md$' \
            | LC_ALL=C sort > "$expected_files"
          git ls-files -- evidence/paper_v2_0 \
            | grep -v '^evidence/paper_v2_0/README.md$' \
            | LC_ALL=C sort > "$current_files"
          test -s "$expected_files"
          test -s "$current_files"

          if ! diff -u "$expected_files" "$current_files"; then
            echo "Tracked evidence/paper_v2_0 file set differs from frozen v0.2.0 release" >&2
            exit 1
          fi

          # Freeze the approved current copies of evidence inventory metadata.
          # The exact-tag step below independently verifies the archived copies.
          while read -r expected_sha inventory_path; do
            if ! git ls-files --error-unmatch -- "$inventory_path" >/dev/null; then
              echo "Frozen evidence inventory is missing or untracked: $inventory_path" >&2
              exit 1
            fi
            current_sha="$(sha256sum "$inventory_path" | awk '{print $1}')"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "Frozen evidence inventory changed: $inventory_path" >&2
              echo "expected sha256: $expected_sha" >&2
              echo "current sha256:  $current_sha" >&2
              exit 1
            fi
          done <<'INVENTORY_SHA256'
          d7c2f2b2caa215901aeb8d92772fe277a454f0c5e15f1152c27fd064177850ad evidence/CHECKSUMS.sha256
          22d1a8731e80c1d8b141ea95e7ce65d4edc37a97b84ece66740d78bed21b47d9 evidence/manifest.csv
          e9b50087fc6ec961bfa089771604c77d6d411c092f44d306306b80852f3c04a6 evidence/paper_v2_0/CHECKSUMS.sha256
          INVENTORY_SHA256

          git show "${METRIPLANE_V020_COMMIT}:evidence/paper_v2_0/CHECKSUMS.sha256" \
            | awk '$2 != "evidence/paper_v2_0/README.md"' \
            > "$frozen_checksums"
          test -s "$frozen_checksums"

          # The paper-evidence README is documentation and may be maintained on main.
          # Every other path in the archived checksum list is frozen evidence payload.
          sha256sum -c "$frozen_checksums" --quiet

      - name: Verify archived v0.2.0 release tree
        shell: bash
        run: |
          set -euo pipefail
          worktree_parent="$(mktemp -d)"
          archive_tree="$worktree_parent/v0.2.0"
          cleanup() {
            git worktree remove --force "$archive_tree" >/dev/null 2>&1 || true
            rm -rf "$worktree_parent"
          }
          trap cleanup EXIT

          git worktree add --detach "$archive_tree" "$METRIPLANE_V020_COMMIT"
          (
            cd "$archive_tree"
            test "$(git rev-parse HEAD)" = "$METRIPLANE_V020_COMMIT"
            sha256sum -c evidence/CHECKSUMS.sha256 --quiet
            "${GITHUB_WORKSPACE}/.venv/bin/python" scripts/audit_evidence.py
          )

  ros2-adapter-static:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked test environment
        run: uv sync --locked --group dev

      - name: Check ROS 2 adapter package structure
        run: |
          uv run python tools/check_ros2_adapters.py
          uv run python -m pytest -q tests/test_ros2_packaging.py tests/test_ros2_msg_adapters.py
