name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main
      - feature/release-v0.2.0
    tags:
      - "v*"

jobs:
  fixture-integrity:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Check required release fixtures
        run: |
          python -m pytest -q tests/test_release_fixture_integrity.py

      - name: Confirm required fixture files are tracked
        run: |
          git ls-files tests/fixtures benchmarks/physical_observability evidence/incidents/INC-0001 evidence/incidents/INC-DIST-001 datasets/demo/atlas | sort
          test -n "$(git ls-files tests/fixtures/contracts/sentinel_minimal_session.jsonl)"
          test -n "$(git ls-files tests/fixtures/camera_trust/multicam_session.jsonl)"
          test -n "$(git ls-files benchmarks/physical_observability/scenarios/blocked_path_001/input_session.jsonl)"
          test -n "$(git ls-files evidence/incidents/INC-0001/session_excerpt.jsonl)"

  ui-static:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Check dashboard JavaScript syntax
        run: |
          for f in web/dashboard/*.js; do node --check "$f"; done

      - name: Run static UI audit
        run: |
          python tools/audit_ui_functionality.py \
            --out evidence/experiments/ui_coverage_latest.csv \
            --json evidence/experiments/ui_coverage_latest.json

      - name: Run UI API and static integrity tests
        run: |
          python -m pytest -q tests/ui_api tests/ui_coverage

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest playwright
          python -m playwright install chromium --with-deps

      - name: Run browser smoke
        run: |
          python -m pytest -q tests/e2e

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Install wheel in fresh venv outside checkout
        run: |
          python -m venv /tmp/metriplane-wheel-smoke
          /tmp/metriplane-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/metriplane-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/metriplane-wheel-smoke/bin/metriplane doctor
          /tmp/metriplane-wheel-smoke/bin/python -c "import metriplane"
          /tmp/metriplane-wheel-smoke/bin/python -c "import integrations.isaac.metriplane_to_usd"
          /tmp/metriplane-wheel-smoke/bin/python -c "import integrations.omniverse.metriplane_usd_replay"

  evidence-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify evidence manifest and checksums
        run: |
          sha256sum -c evidence/CHECKSUMS.sha256 --quiet
          python scripts/audit_evidence.py

  ros2-adapter-static:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Check ROS 2 adapter package structure
        run: |
          python tools/check_ros2_adapters.py
          python -m pytest -q tests/test_ros2_packaging.py tests/test_ros2_msg_adapters.py
