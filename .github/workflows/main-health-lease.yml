name: Main Health Lease
run-name: Main Health Lease / ${{ github.event.client_payload.origin_run_id }}/${{ github.event.client_payload.origin_run_attempt }} / ${{ github.event.client_payload.nonce }} / ${{ github.event.client_payload.replica }}

on:
  repository_dispatch:
    types: [main-health-expire]

permissions:
  contents: read

jobs:
  arm-and-wait:
    name: Main health lease closer / ${{ github.event.client_payload.replica }}
    if: >-
      github.actor == format('{0}[bot]', vars.MAIN_HEALTH_APP_SLUG) &&
      github.event.sender.login == format('{0}[bot]', vars.MAIN_HEALTH_APP_SLUG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main-health-publisher
    steps:
      - name: Mint isolated publisher token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MAIN_HEALTH_APP_ID }}
          private-key: ${{ secrets.MAIN_HEALTH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Check out trusted lease code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: refs/heads/main

      - name: Arm lease and wait for shared deadline
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PUBLISHER_APP_ID: ${{ vars.MAIN_HEALTH_APP_ID }}
          PUBLISHER_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
        run: |
          set -euo pipefail
          leases="$RUNNER_TEMP/main-health-expiry-leases.tsv"
          metadata="$RUNNER_TEMP/main-health-expiry-metadata.tsv"
          python - "$PAYLOAD" "$metadata" > "$leases" <<'PY'
          import datetime
          import json
          import pathlib
          import re
          import sys

          payload = json.loads(sys.argv[1])
          if set(payload) != {
              "deadline",
              "deadline_epoch",
              "leases",
              "nonce",
              "origin_run_attempt",
              "origin_run_id",
              "replica",
          }:
              raise SystemExit("main-health lease payload has unexpected fields")
          run_id = str(payload["origin_run_id"])
          run_attempt = str(payload["origin_run_attempt"])
          nonce = payload["nonce"]
          deadline = payload["deadline"]
          deadline_epoch = payload["deadline_epoch"]
          replica = payload["replica"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("main-health lease origin run is invalid")
          if not re.fullmatch(r"[1-9][0-9]*", run_attempt):
              raise SystemExit("main-health lease origin attempt is invalid")
          if not isinstance(nonce, str) or not re.fullmatch(r"[0-9a-f]{32}", nonce):
              raise SystemExit("main-health lease nonce is invalid")
          if replica not in {1, 2}:
              raise SystemExit("main-health lease replica is invalid")
          if not isinstance(deadline_epoch, int) or deadline_epoch <= 0:
              raise SystemExit("main-health lease deadline epoch is invalid")
          try:
              parsed_deadline = datetime.datetime.fromisoformat(
                  str(deadline).replace("Z", "+00:00")
              )
          except ValueError as exc:
              raise SystemExit("main-health lease deadline is malformed") from exc
          if (
              parsed_deadline.tzinfo is None
              or int(parsed_deadline.timestamp()) != deadline_epoch
              or parsed_deadline.microsecond != 0
          ):
              raise SystemExit("main-health lease deadline is inconsistent")
          pathlib.Path(sys.argv[2]).write_text(
              f"{run_id}\t{run_attempt}\t{nonce}\t{replica}\t"
              f"{deadline}\t{deadline_epoch}\n",
              encoding="utf-8",
          )
          leases = payload["leases"]
          if not isinstance(leases, list) or not leases or len(leases) > 1000:
              raise SystemExit("main-health lease inventory is invalid")
          seen: set[str] = set()
          for lease in leases:
              if not isinstance(lease, dict) or set(lease) != {
                  "check_run_id",
                  "external_id",
                  "head_sha",
              }:
                  raise SystemExit("main-health lease entry is malformed")
              sha = lease["head_sha"]
              check_run_id = lease["check_run_id"]
              expected_external_id = (
                  f"mh1:{sha}:{run_id}:{run_attempt}:{nonce}:{deadline_epoch}"
              )
              if (
                  not isinstance(sha, str)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or sha in seen
                  or not isinstance(check_run_id, int)
                  or check_run_id <= 0
                  or lease["external_id"] != expected_external_id
              ):
                  raise SystemExit("main-health lease entry is not provider-bound")
              seen.add(sha)
              print(sha, check_run_id, expected_external_id, sep="\t")
          PY
          IFS=$'\t' read -r origin_run_id origin_run_attempt lease_nonce replica \
            deadline deadline_epoch < "$metadata"
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          while IFS=$'\t' read -r head_sha check_run_id external_id; do
            required="$RUNNER_TEMP/main-health-required-${head_sha}.json"
            python tools/stop_the_line.py github-check-get \
              --repository "$GITHUB_REPOSITORY" \
              --head-sha "$head_sha" \
              --name "Main health admission / required" \
              --app-id "$PUBLISHER_APP_ID" \
              --app-slug "$PUBLISHER_APP_SLUG" > "$required"
            jq -e \
              --arg external_id "$external_id" \
              --argjson check_run_id "$check_run_id" \
              '.id == $check_run_id and .external_id == $external_id and
               .conclusion == "failure" and .status == "completed"' \
              "$required" >/dev/null
            marker_external_id="mh1-closer:${head_sha}:${origin_run_id}:${origin_run_attempt}:${lease_nonce}:${deadline_epoch}:${replica}:${check_run_id}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
            python tools/stop_the_line.py github-check-set \
              --repository "$GITHUB_REPOSITORY" \
              --head-sha "$head_sha" \
              --name "Main health lease closer / ${replica}" \
              --external-id "$marker_external_id" \
              --conclusion success \
              --details-url "$details_url" \
              --output-title "Main health lease closer armed" \
              --output-summary "Replica ${replica} is waiting for ${deadline}." \
              --app-id "$PUBLISHER_APP_ID" \
              --app-slug "$PUBLISHER_APP_SLUG" >/dev/null
          done < "$leases"

          while true; do
            clock="$(python tools/stop_the_line.py github-provider-clock)"
            now_epoch="$(jq -er '.epoch' <<<"$clock")"
            if (( now_epoch >= deadline_epoch )); then
              break
            fi
            remaining=$((deadline_epoch - now_epoch))
            if (( remaining > 15 )); then
              remaining=15
            fi
            sleep "$remaining"
          done

  expire-successes:
    name: Main health lease expiry writer / ${{ github.event.client_payload.replica }}
    if: always() && needs.arm-and-wait.result == 'success'
    needs: arm-and-wait
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: main-health-publisher
    concurrency:
      group: main-health-check-writer
      queue: max
    steps:
      - name: Mint isolated publisher token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MAIN_HEALTH_APP_ID }}
          private-key: ${{ secrets.MAIN_HEALTH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Check out trusted lease code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: refs/heads/main

      - name: Expire exact check-run generations
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PUBLISHER_APP_ID: ${{ vars.MAIN_HEALTH_APP_ID }}
          PUBLISHER_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
        run: |
          set -euo pipefail
          leases="$RUNNER_TEMP/main-health-expiry-leases.tsv"
          python - "$PAYLOAD" > "$leases" <<'PY'
          import json
          import re
          import sys

          payload = json.loads(sys.argv[1])
          run_id = str(payload.get("origin_run_id", ""))
          run_attempt = str(payload.get("origin_run_attempt", ""))
          nonce = payload.get("nonce")
          deadline_epoch = payload.get("deadline_epoch")
          replica = payload.get("replica")
          leases = payload.get("leases")
          if (
              set(payload) != {
                  "deadline",
                  "deadline_epoch",
                  "leases",
                  "nonce",
                  "origin_run_attempt",
                  "origin_run_id",
                  "replica",
              }
              or not re.fullmatch(r"[1-9][0-9]*", run_id)
              or not re.fullmatch(r"[1-9][0-9]*", run_attempt)
              or not isinstance(nonce, str)
              or not re.fullmatch(r"[0-9a-f]{32}", nonce)
              or not isinstance(deadline_epoch, int)
              or deadline_epoch <= 0
              or replica not in {1, 2}
              or not isinstance(leases, list)
              or not leases
              or len(leases) > 1000
          ):
              raise SystemExit("main-health expiry payload is invalid")
          seen: set[str] = set()
          for lease in leases:
              if not isinstance(lease, dict) or set(lease) != {
                  "check_run_id",
                  "external_id",
                  "head_sha",
              }:
                  raise SystemExit("main-health expiry lease is malformed")
              sha = lease["head_sha"]
              check_run_id = lease["check_run_id"]
              expected_external_id = (
                  f"mh1:{sha}:{run_id}:{run_attempt}:{nonce}:{deadline_epoch}"
              )
              if (
                  not isinstance(sha, str)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or sha in seen
                  or not isinstance(check_run_id, int)
                  or check_run_id <= 0
                  or lease["external_id"] != expected_external_id
              ):
                  raise SystemExit("main-health expiry lease is not provider-bound")
              seen.add(sha)
              print(sha, check_run_id, expected_external_id, sep="\t")
          PY
          details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          while IFS=$'\t' read -r head_sha check_run_id external_id; do
            python tools/stop_the_line.py github-check-expire \
              --repository "$GITHUB_REPOSITORY" \
              --head-sha "$head_sha" \
              --check-run-id "$check_run_id" \
              --name "Main health admission / required" \
              --external-id "$external_id" \
              --details-url "$details_url" \
              --output-title "Main health admission expired" \
              --output-summary "The shared provider deadline elapsed." \
              --app-id "$PUBLISHER_APP_ID" \
              --app-slug "$PUBLISHER_APP_SLUG"
          done < "$leases"
