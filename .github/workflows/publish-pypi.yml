              hosts.append(host)
          if hosts[0] == hosts[1]:
              raise SystemExit("authority stores must use distinct HTTPS host identities")
          PY
          curl --proto '=https' \
            --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-filesize 536870912 --max-time 300 \
            --retry 3 --retry-all-errors \
