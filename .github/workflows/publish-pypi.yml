              "id": release_run_id,
          }
          release_artifact_mismatches.update(
              {
                  f"workflow_run.{key}": (release_workflow_run.get(key), expected)
                  for key, expected in expected_release_artifact_run.items()
                  if release_workflow_run.get(key) != expected
              }
          )
          if release_artifact_mismatches:
              raise SystemExit(f"fresh release artifact mismatch: {release_artifact_mismatches}")

          root = Path("release-authority")
          bound_sources = {
              "delta.json": "candidate_sha",
              "gate-instance.json": "frozen_source_sha",
              "impact-manifest.json": "head_sha",
              "source-freeze.json": "source_sha",
          }
          for relative, field in bound_sources.items():
              record = json.loads((root / relative).read_text(encoding="utf-8"))
              if record.get("data", {}).get(field) != candidate_sha:
                  raise SystemExit(f"fresh authority source mismatch: {relative}")
          gate = json.loads((root / "gate-instance.json").read_text(encoding="utf-8"))
          roles = json.loads((root / "role-assignments.json").read_text(encoding="utf-8"))
          authority_run_id = gate.get("data", {}).get("run_id")
          if (
              authority_run_id != os.environ["AUTHORITY_SOURCE_RUN_ID"]
              or roles.get("data", {}).get("run_id") != authority_run_id
          ):
              raise SystemExit("fresh authority external run binding mismatch")
          PY

          test "$(sha256sum release-authority/qualification.json | awk '{print $1}')" = \
            "$QUALIFICATION_RECORD_DIGEST"
          milestone="v${RELEASE_VERSION%.*}"
          case "$milestone" in
            v0.4|v0.5|v0.6|v0.7|v0.8|v0.9|v1.0) ;;
            *) echo "unsupported cumulative release milestone: $milestone" >&2; exit 1 ;;
          esac
          authority_run_id="$(python -c \
            'import json; print(json.load(open("release-authority/gate-instance.json"))["data"]["run_id"])')"
          uv run python tools/validate_release_gate_instance.py \
            --record release-authority/gate-instance.json \
            --candidate-identity release-authority/candidate-identity.json \
            --predecessor release-authority/predecessor.json \
            --task-state-policy docs/status/release-task-state-policy.json \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST"
          uv run python tools/validate_release_role_assignments.py \
            --record release-authority/role-assignments.json \
            --milestone "$milestone" \
            --run-id "$authority_run_id" \
            --check-conflicts \
            --check-freshness \
            --authority-policy-digest "$AUTHORITY_POLICY_DIGEST" \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST"
          uv run python tools/validate_release_qualification_plan.py \
            --record release-authority/qualification-plan.json \
            --gate-instance release-authority/gate-instance.json \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST"
          uv run python tools/validate_release_qualification.py \
            --record release-authority/qualification.json \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST" \
            "${attempt_store_readback_args[@]}"
          uv run python tools/validate_release_retention.py \
            --manifest release-authority/evidence-manifest.json \
            --receipts release-authority/prepublication/retention-receipts.json \
            --read-back \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST" \
            --store-readback \
              "payload-store-a=$STORE_A_READBACK_ROOT/evidence-manifest.json" \
            --store-readback \
              "payload-store-b=$STORE_B_READBACK_ROOT/evidence-manifest.json"
          uv run python tools/validate_release_approval.py \
            --approval-decision "$APPROVAL_DECISION_PATH" \
            --gate-instance release-authority/gate-instance.json \
            --qualification release-authority/qualification.json \
            --role-assignments release-authority/role-assignments.json \
            --no-prepublication-rubric \
            --record release-authority/prepublication/approval.json \
            --authority-policy-digest "$AUTHORITY_POLICY_DIGEST" \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST"
          uv run python tools/check_release_readiness.py \
            --gate-instance release-authority/gate-instance.json \
            --candidate-identity release-authority/candidate-identity.json \
            --predecessor release-authority/predecessor.json \
            --linear-snapshot release-authority/linear-snapshot.json \
            --artifact-manifest release-authority/artifact-manifest.json \
            --delta release-authority/delta.json \
            --delta-test-map release-authority/delta-test-map.json \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST" \
            --out "${RUNNER_TEMP}/fresh-readiness.json"
          cmp --silent release-authority/readiness.json "${RUNNER_TEMP}/fresh-readiness.json"
          python tools/release_artifacts.py verify-manifest \
            --dist release-artifacts/dist \
            --manifest release-artifacts/SHA256SUMS \
            --version "$RELEASE_VERSION"
          python tools/release_artifacts.py verify-registry \
            --repository https://test.pypi.org \
            --version "$RELEASE_VERSION" \
            --manifest release-artifacts/SHA256SUMS
          uv run python tools/validate_release_artifact_manifest.py \
            --record release-authority/artifact-manifest.json \
            --artifacts release-artifacts/dist \
            --read-hash \
            --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
            --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST"

          if [[ -e release-authority/final-retention-receipts.json || \
                -e release-authority/publication-reconciliation.json ]]; then
            test -f release-authority/final-retention-receipts.json
            test -f release-authority/publication-reconciliation.json
            uv run python tools/validate_release_retention.py \
              --manifest release-authority/evidence-manifest.json \
              --receipts release-authority/final-retention-receipts.json \
              --read-back \
              --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
              --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST" \
              --store-readback \
                "payload-store-a=$STORE_A_READBACK_ROOT/evidence-manifest.json" \
              --store-readback \
                "payload-store-b=$STORE_B_READBACK_ROOT/evidence-manifest.json"
            uv run python tools/validate_publication_reconciliation.py \
              --record release-authority/publication-reconciliation.json \
              --authority-policy-digest "$AUTHORITY_POLICY_DIGEST" \
              --provider-attestation-keyring "$PROVIDER_ATTESTATION_KEYRING" \
              --provider-attestation-keyring-digest "$PROVIDER_ATTESTATION_KEYRING_DIGEST" \
              --store-readback \
                "payload-store-a=$STORE_A_READBACK_ROOT/evidence-manifest.json" \
              --store-readback \
                "payload-store-b=$STORE_B_READBACK_ROOT/evidence-manifest.json" \
              "${attempt_store_readback_args[@]}"
          fi

          echo "release_artifact_id=$RELEASE_ARTIFACT_ID" >> "$GITHUB_OUTPUT"

  publish-pypi:
    name: Publish the authorized immutable artifact to PyPI
    if: github.event_name == 'workflow_dispatch'
    needs: authorize-production
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/metriplane
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.authorize-production.outputs.release_artifact_id }}
          path: release-artifacts/
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Publish the verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/dist/

  verify-pypi:
    name: Verify production artifact identity and installation
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-production-request, publish-pypi]
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ needs.validate-production-request.outputs.commit }}
      RELEASE_VERSION: ${{ needs.validate-production-request.outputs.version }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-production-request.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.validate-production-request.outputs.release_artifact_id }}
          path: release-artifacts/
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Match PyPI files to the build manifest
        run: |
          python tools/release_artifacts.py verify-manifest \
            --dist release-artifacts/dist \
            --manifest release-artifacts/SHA256SUMS \
            --version "$RELEASE_VERSION"
          python tools/release_artifacts.py verify-registry \
            --repository https://pypi.org \
            --version "$RELEASE_VERSION" \
            --manifest release-artifacts/SHA256SUMS

      - name: Install the tagged package from production PyPI
        shell: bash
        run: |
          set -euo pipefail
          verify_venv="${RUNNER_TEMP}/metriplane-pypi-verify"
          python -m venv "$verify_venv"
          "$verify_venv/bin/python" -m pip install --upgrade pip
          for attempt in {1..12}; do
            if "$verify_venv/bin/python" -m pip install \
              --no-cache-dir \
              "metriplane==${RELEASE_VERSION}"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "PyPI did not serve metriplane==${RELEASE_VERSION} in time" >&2
              exit 1
            fi
            sleep 10
          done

          cd "$RUNNER_TEMP"
          "$verify_venv/bin/python" -m pip check
          test "$("$verify_venv/bin/metriplane" --version)" = \
            "metriplane ${RELEASE_VERSION}"
          doctor_output="$("$verify_venv/bin/metriplane" doctor)"
          printf '%s\n' "$doctor_output"
          grep -Fxq "Ready for the bundled camera-free demo." <<<"$doctor_output"
          "$verify_venv/bin/metriplane" demo --out demo-pypi
          "$verify_venv/bin/metriplane" atlas bundle verify \
            demo-pypi/evidence_bundles/INC-0001.zip | grep -q '"pass": true'
          "$verify_venv/bin/metriplane" atlas test \
            demo-pypi/regression_tests/INC-0001.yaml --json | grep -q '"pass": true'
          VERSION="$RELEASE_VERSION" "$verify_venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import os
          import metriplane

          expected = os.environ["VERSION"]
          assert metriplane.__version__ == metadata.version("metriplane") == expected
          PY

      - name: Record the exact verified production target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "production_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "schema_version": "metriplane.production-verification.v1",
              "version": os.environ["RELEASE_VERSION"],
          }
          payload = json.dumps(
              record,
              ensure_ascii=True,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8") + b"\n"
          Path("production-verification.json").write_bytes(payload)
          PY

      - name: Retain exact production verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verification
          path: production-verification.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
