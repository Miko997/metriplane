          test "$store_a_sha256" = "$store_b_sha256"
          test "$store_a_sha256" = "$AUTHORITY_BUNDLE_SHA256"

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import tarfile
          from pathlib import Path, PurePosixPath

          DIGEST = re.compile(r"[0-9a-f]{64}")
          RECORD_FIELDS = {
              "data",
              "invocation_id",
              "payload_digest",
              "record_id",
              "record_type",
              "schema_version",
              "sequence",
              "signatures",
              "status",
              "synthetic",
          }

          def require_digest(value: object, label: str) -> str:
              if not isinstance(value, str) or DIGEST.fullmatch(value) is None:
                  raise SystemExit(f"{label} is not a canonical SHA-256 digest")
              return value

          def closed_object(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def read_archive(path: Path, store_id: str) -> dict[str, bytes]:
              members: dict[str, bytes] = {}
              names: dict[str, str] = {}
              expanded_size = 0
              root_directory_seen = False
              with tarfile.open(path, mode="r:*") as archive:
                  entries = archive.getmembers()
                  if not entries or len(entries) > 10_000:
                      raise SystemExit(f"{store_id} authority bundle has an invalid member count")
                  for member in entries:
                      raw_name = member.name
                      is_directory = member.isdir()
                      if not is_directory and not member.isfile():
                          raise SystemExit(f"{store_id} authority member is unsafe: {raw_name}")
                      path_name = (
                          raw_name[:-1]
                          if is_directory and raw_name.endswith("/")
                          else raw_name
                      )
                      raw_parts = path_name.split("/")
                      if (
                          not path_name
                          or "\\" in path_name
                      or any(
                          ord(character) < 32 or ord(character) == 127
                          for character in path_name
                      )
                          or any(part in {"", ".."} for part in raw_parts)
                      ):
                          raise SystemExit(f"{store_id} authority path is unsafe: {raw_name!r}")
                      if raw_parts[0] == ".":
                          raw_parts = raw_parts[1:]
                      if not raw_parts:
                          if not is_directory or root_directory_seen:
                              raise SystemExit(f"{store_id} authority bundle misuses its root")
                          root_directory_seen = True
                          continue
                      if any(part in {"", ".", ".."} for part in raw_parts):
                          raise SystemExit(f"{store_id} authority path is unsafe: {raw_name!r}")
                      if re.fullmatch(r"[A-Za-z]:", raw_parts[0]) is not None:
                          raise SystemExit(f"{store_id} authority drive path is unsafe: {raw_name!r}")
                      relative = PurePosixPath(*raw_parts)
                      normalized = relative.as_posix()
                      if relative.is_absolute() or normalized in names:
                          raise SystemExit(
                              f"{store_id} authority path is repeated or absolute: {raw_name!r}"
                          )
                      if member.size < 0 or (is_directory and member.size != 0):
                          raise SystemExit(
                              f"{store_id} authority member size is invalid: {normalized}"
                          )
                      names[normalized] = "directory" if is_directory else "file"
                      if is_directory:
                          continue
                      expanded_size += member.size
                      if expanded_size > 512 * 1024 * 1024:
                          raise SystemExit(f"{store_id} authority bundle expands too far")
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(
                              f"{store_id} authority member has no bytes: {normalized}"
                          )
                      value = source.read(member.size + 1)
                      if len(value) != member.size:
                          raise SystemExit(
                              f"{store_id} authority member size changed: {normalized}"
                          )
                      members[normalized] = value
              for normalized in names:
                  for parent in PurePosixPath(normalized).parents:
                      if parent == PurePosixPath("."):
                          break
                      if names.get(parent.as_posix()) == "file":
                          raise SystemExit(
                              f"{store_id} authority has a file/path collision: {normalized}"
                          )
              return members

          def parse_record(payload: bytes, label: str) -> dict[str, object]:
              try:
                  value = json.loads(
                      payload.decode("utf-8"), object_pairs_hook=closed_object
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
                  raise SystemExit(f"{label} is not closed UTF-8 JSON") from exc
              if not isinstance(value, dict):
                  raise SystemExit(f"{label} is not a JSON record object")
              return value

          def write_exclusive(path: Path, payload: bytes) -> None:
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags, 0o400)
              with os.fdopen(descriptor, "wb") as output:
                  output.write(payload)
                  output.flush()
                  os.fsync(output.fileno())

          def materialize(root: Path, values: dict[str, bytes]) -> None:
              if root.exists() or root.is_symlink():
                  raise SystemExit(f"authority readback destination already exists: {root.name}")
              root.mkdir(mode=0o700)
              resolved_root = root.resolve()
              for name in sorted(values):
                  relative = PurePosixPath(name)
                  parent = root
                  for part in relative.parts[:-1]:
                      parent /= part
                      try:
                          parent.mkdir(mode=0o700)
                      except FileExistsError:
                          if parent.is_symlink() or not parent.is_dir():
                              raise SystemExit(f"authority readback parent is unsafe: {name}")
                  target = root.joinpath(*relative.parts)
                  if not target.parent.resolve().is_relative_to(resolved_root):
                      raise SystemExit(f"authority readback escapes its root: {name}")
                  write_exclusive(target, values[name])
                  if hashlib.sha256(target.read_bytes()).digest() != hashlib.sha256(
                      values[name]
                  ).digest():
                      raise SystemExit(f"authority readback changed while materializing: {name}")

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          store_a_members = read_archive(
              runner_temp / "authority-store-a.tar", "payload-store-a"
          )
          store_b_members = read_archive(
              runner_temp / "authority-store-b.tar", "payload-store-b"
          )
          if set(store_a_members) != set(store_b_members) or any(
              store_a_members[name] != store_b_members[name] for name in store_a_members
          ):
              raise SystemExit("external authority stores differ after safe archive parsing")
          store_a_json = {
              name: value for name, value in store_a_members.items() if name.endswith(".json")
          }
          store_b_json = {
              name: value for name, value in store_b_members.items() if name.endswith(".json")
          }
          if not store_a_json:
              raise SystemExit("external authority stores contain no JSON records")
          if set(store_a_members) != set(store_a_json):
              raise SystemExit("external authority stores contain unexpected non-JSON files")

          disk_root_path = Path("release-authority")
          if disk_root_path.is_symlink() or not disk_root_path.is_dir():
              raise SystemExit("downloaded authority root is missing or unsafe")
          disk_root = disk_root_path.resolve()
          disk_json: dict[str, bytes] = {}
          for path in sorted(disk_root.rglob("*.json")):
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(disk_root):
                  raise SystemExit(f"downloaded authority path is unsafe: {path}")
              parent = disk_root
              for part in path.relative_to(disk_root).parts[:-1]:
                  parent /= part
                  if parent.is_symlink() or not parent.is_dir():
                      raise SystemExit(f"downloaded authority parent is unsafe: {path}")
              disk_json[path.relative_to(disk_root).as_posix()] = path.read_bytes()
          if set(store_a_json) != set(disk_json):
              raise SystemExit("external stores and GitHub artifact have different JSON inventories")
          if any(store_a_json[name] != disk_json[name] for name in store_a_json):
              raise SystemExit("external stores and GitHub artifact contain digest-mismatched records")

          records = {
              name: parse_record(value, f"retained authority {name}")
              for name, value in store_a_json.items()
          }
          digest_index: dict[str, list[str]] = {}
          for name, value in store_a_json.items():
              digest_index.setdefault(hashlib.sha256(value).hexdigest(), []).append(name)

          def required_record(name: str, expected_type: str) -> dict[str, object]:
              record = records.get(name)
              if (
                  record is None
                  or set(record) != RECORD_FIELDS
                  or record.get("schema_version") != "metriplane.release-record.v1"
                  or record.get("record_type") != expected_type
                  or record.get("status") != "PASS"
                  or record.get("synthetic") is not False
              ):
                  raise SystemExit(f"required live authority record is missing or invalid: {name}")
              return record

          def resolve_record(
              digest: object, expected_type: str, label: str
          ) -> tuple[str, dict[str, object]]:
              required_digest = require_digest(digest, label)
              matches = digest_index.get(required_digest, [])
              if len(matches) != 1:
                  raise SystemExit(f"{label} does not resolve exactly once")
              name = matches[0]
              return name, required_record(name, expected_type)

          manifest = required_record("evidence-manifest.json", "release-evidence-manifest")
          del manifest
          manifest_digest = hashlib.sha256(store_a_json["evidence-manifest.json"]).hexdigest()
          if manifest_digest != os.environ["EVIDENCE_MANIFEST_SHA256"]:
              raise SystemExit("external evidence manifest digest mismatch")
          required_record(
              "prepublication/retention-receipts.json", "release-retention-receipts"
          )

          postpublication_names = {
              "final-retention-receipts.json",
              "publication-reconciliation.json",
          }
          present_postpublication = postpublication_names & set(records)
          if present_postpublication and present_postpublication != postpublication_names:
              raise SystemExit("postpublication authority inventory is incomplete")
          if present_postpublication:
              required_record("final-retention-receipts.json", "release-retention-receipts")
              required_record(
                  "publication-reconciliation.json", "release-publication-reconciliation"
              )

          approval = required_record("prepublication/approval.json", "release-approval")
          approval_data = approval.get("data")
          if not isinstance(approval_data, dict):
              raise SystemExit("prepublication approval data is missing")
          decision_name, _decision = resolve_record(
              approval_data.get("approval_decision_digest"),
              "release-approval-decision",
              "approval decision digest",
          )

          qualification = required_record("qualification.json", "release-qualification")
          qualification_data = qualification.get("data")
          retention_digests = (
              qualification_data.get("attempt_retention_receipt_digests")
              if isinstance(qualification_data, dict)
              else None
          )
          if (
              not isinstance(retention_digests, list)
              or not retention_digests
              or any(
                  not isinstance(digest, str) or DIGEST.fullmatch(digest) is None
                  for digest in retention_digests
              )
              or len(retention_digests) != len(set(retention_digests))
          ):
              raise SystemExit("qualification attempt retention inventory is incomplete")

          store_a_root = runner_temp / "authority-store-a-readback"
          store_b_root = runner_temp / "authority-store-b-readback"
          materialize(store_a_root, store_a_json)
          materialize(store_b_root, store_b_json)

          bindings: list[str] = []
          for retention_digest in retention_digests:
              _receipt_name, receipt = resolve_record(
                  retention_digest,
                  "release-retention-receipts",
                  "qualification attempt retention receipt digest",
              )
              receipt_data = receipt.get("data")
              if not isinstance(receipt_data, dict):
                  raise SystemExit("qualification attempt retention data is missing")
              manifest_name, _attempt_manifest = resolve_record(
                  receipt_data.get("input_digest"),
                  "release-evidence-manifest",
                  "qualification attempt manifest digest",
              )
              if "=" in manifest_name:
                  raise SystemExit("qualification attempt manifest path is not CLI-safe")
              for store_id, root in (
                  ("payload-store-a", store_a_root),
                  ("payload-store-b", store_b_root),
              ):
                  path = root.joinpath(*PurePosixPath(manifest_name).parts)
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit("qualification attempt readback is missing or unsafe")
                  bindings.append(f"{retention_digest}:{store_id}={path}")

          write_exclusive(
              runner_temp / "release-approval-decision.json",
              store_a_json[decision_name],
          )
          write_exclusive(
              runner_temp / "attempt-store-readbacks.txt",
              ("\n".join(bindings) + "\n").encode("utf-8"),
          )
          PY

      - id: authorization
        name: Revalidate exact authority and artifacts immediately before OIDC handoff
        env:
          APPROVAL_DECISION_PATH: ${{ runner.temp }}/release-approval-decision.json
          ATTEMPT_STORE_READBACKS: ${{ runner.temp }}/attempt-store-readbacks.txt
          AUTHORITY_POLICY_DIGEST: ${{ inputs.authority_policy_digest }}
          AUTHORITY_SOURCE_RUN_ID: ${{ inputs.authority_run_id }}
          CANDIDATE_SHA: ${{ needs.validate-production-request.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          PROVIDER_ATTESTATION_KEYRING: ${{ runner.temp }}/provider-attestation-keyring.json
          PROVIDER_ATTESTATION_KEYRING_DIGEST: ${{ inputs.provider_attestation_keyring_digest }}
          QUALIFICATION_ARTIFACT_ID: ${{ needs.validate-production-request.outputs.qualification_artifact_id }}
          QUALIFICATION_HEAD_SHA: ${{ needs.validate-production-request.outputs.qualification_head_sha }}
          QUALIFICATION_RECORD_DIGEST: ${{ inputs.qualification_record_digest }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_ARTIFACT_ID: ${{ needs.validate-production-request.outputs.release_artifact_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_VERSION: ${{ needs.validate-production-request.outputs.version }}
          STORE_A_READBACK_ROOT: ${{ runner.temp }}/authority-store-a-readback
          STORE_B_READBACK_ROOT: ${{ runner.temp }}/authority-store-b-readback
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$QUALIFICATION_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALIFICATION_RECORD_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
