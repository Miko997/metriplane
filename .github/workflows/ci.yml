name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: read-all

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-validation:
    name: Fast source validation
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Record checked-out source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked test environment
        run: uv sync --locked --group dev

      - name: Check maintained Python quality
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy

      - name: Validate pull request contract
        if: github.event_name == 'pull_request'
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git cat-file -e "${BASE_SHA}:tools/check_pr_contract.py" 2>/dev/null; then
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/reviews?per_page=100" \
              | jq 'add' > "$RUNNER_TEMP/pr-reviews.json"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              | jq '{pull_request: .}' > "$RUNNER_TEMP/pr-current.json"
            jq -e --arg head "$EVENT_HEAD" \
              '.pull_request.head.sha == $head and .pull_request.state == "open"' \
              "$RUNNER_TEMP/pr-current.json"
            uv run --frozen python tools/check_pr_contract.py \
              --event "$RUNNER_TEMP/pr-current.json" \
              --reviews-file "$RUNNER_TEMP/pr-reviews.json"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              | jq '{pull_request: .}' > "$RUNNER_TEMP/pr-readback.json"
            jq -e --slurpfile before "$RUNNER_TEMP/pr-current.json" \
              '.pull_request.head.sha == $before[0].pull_request.head.sha and
               .pull_request.body == $before[0].pull_request.body and
               .pull_request.state == "open"' "$RUNNER_TEMP/pr-readback.json"
          else
            printf '%s\n' 'MP2-004 transition PR uses the previous repository template.'
          fi

  test:
    needs: fast-validation
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      METRIPLANE_V020_TAG: "v0.2.0"
      METRIPLANE_V020_COMMIT: "8e35ed5bb20837f7dc46354777407b848d7ce17a"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Record checked-out source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked test environment
        run: uv sync --locked --group dev

      - name: Install browser for E2E smoke
        run: uv run python -m playwright install chromium --with-deps

      - name: Check required release fixtures
        run: uv run python -m pytest -q tests/test_release_fixture_integrity.py

      - name: Run complete Linux suite with original evidence
        run: >-
          uv run --frozen python tools/check_required_terminal.py shard-run
          --platform linux --python-version 3.12 --shard-index 0 --shard-count 1
          --report-dir "$RUNNER_TEMP/ci-suite"
      - name: Retain Linux suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-suite-${{ github.run_id }}-${{ github.run_attempt }}-linux-py3.12-shard0
          path: ${{ runner.temp }}/ci-suite
          if-no-files-found: error

      - name: Run doctor
        run: uv run python -m metriplane.cli doctor

      - name: Check dashboard JavaScript syntax
        run: |
          for f in web/dashboard/*.js; do node --check "$f"; done

      - name: Check ROS 2 adapter/package structure
        run: uv run python tools/check_ros2_adapters.py

      - name: Verify current copies of frozen v0.2.0 evidence payload
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${METRIPLANE_V020_TAG}^{commit}")"
          if [[ "$tag_commit" != "$METRIPLANE_V020_COMMIT" ]]; then
            echo "${METRIPLANE_V020_TAG} resolves to $tag_commit, expected $METRIPLANE_V020_COMMIT" >&2
            exit 1
          fi

          expected_files="$(mktemp)"
          current_files="$(mktemp)"
          frozen_checksums="$(mktemp)"
          cleanup() {
            rm -f "$expected_files" "$current_files" "$frozen_checksums"
          }
          trap cleanup EXIT

          git ls-tree -r --name-only "$METRIPLANE_V020_COMMIT" \
            -- evidence/paper_v2_0 \
            | grep -v '^evidence/paper_v2_0/README.md$' \
            | LC_ALL=C sort > "$expected_files"
          git ls-files -- evidence/paper_v2_0 \
            | grep -v '^evidence/paper_v2_0/README.md$' \
            | LC_ALL=C sort > "$current_files"
          test -s "$expected_files"
          test -s "$current_files"

          if ! diff -u "$expected_files" "$current_files"; then
            echo "Tracked evidence/paper_v2_0 file set differs from frozen v0.2.0 release" >&2
            exit 1
          fi

          while read -r expected_sha inventory_path; do
            if ! git ls-files --error-unmatch -- "$inventory_path" >/dev/null; then
              echo "Frozen evidence inventory is missing or untracked: $inventory_path" >&2
              exit 1
            fi
            current_sha="$(sha256sum "$inventory_path" | awk '{print $1}')"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "Frozen evidence inventory changed: $inventory_path" >&2
              echo "expected sha256: $expected_sha" >&2
              echo "current sha256:  $current_sha" >&2
              exit 1
            fi
          done <<'INVENTORY_SHA256'
          d7c2f2b2caa215901aeb8d92772fe277a454f0c5e15f1152c27fd064177850ad evidence/CHECKSUMS.sha256
          22d1a8731e80c1d8b141ea95e7ce65d4edc37a97b84ece66740d78bed21b47d9 evidence/manifest.csv
          e9b50087fc6ec961bfa089771604c77d6d411c092f44d306306b80852f3c04a6 evidence/paper_v2_0/CHECKSUMS.sha256
          INVENTORY_SHA256

          git show "${METRIPLANE_V020_COMMIT}:evidence/paper_v2_0/CHECKSUMS.sha256" \
            | awk '$2 != "evidence/paper_v2_0/README.md"' \
            > "$frozen_checksums"
          test -s "$frozen_checksums"
          sha256sum -c "$frozen_checksums" --quiet

      - name: Verify archived v0.2.0 release tree
        shell: bash
        run: |
          set -euo pipefail
          worktree_parent="$(mktemp -d)"
          archive_tree="$worktree_parent/v0.2.0"
          cleanup() {
            git worktree remove --force "$archive_tree" >/dev/null 2>&1 || true
            rm -rf "$worktree_parent"
          }
          trap cleanup EXIT

          git worktree add --detach "$archive_tree" "$METRIPLANE_V020_COMMIT"
          (
            cd "$archive_tree"
            test "$(git rev-parse HEAD)" = "$METRIPLANE_V020_COMMIT"
            sha256sum -c evidence/CHECKSUMS.sha256 --quiet
            uv run python scripts/audit_evidence.py
          )

      - name: Check shell script syntax
        run: bash -n tools/mp.sh

      - name: Verify import
        run: uv run python -c "import metriplane; print('ok')"

  macos-regressions:
    needs: fast-validation
    name: macOS full suite (Python ${{ matrix.python-version }}, shard ${{ matrix.shard-index }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard-index: [0, 1, 2, 3]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Record checked-out source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/empty-browser-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - name: Run independently partitioned camera-free suite
        run: >-
          uv run --frozen --python ${{ matrix.python-version }}
          python tools/check_required_terminal.py shard-run
          --platform macos --python-version ${{ matrix.python-version }}
          --shard-index ${{ matrix.shard-index }} --shard-count 4
          --report-dir "$RUNNER_TEMP/ci-suite"
      - name: Retain macOS shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-suite-${{ github.run_id }}-${{ github.run_attempt }}-macos-py${{ matrix.python-version }}-shard${{ matrix.shard-index }}
          path: ${{ runner.temp }}/ci-suite
          if-no-files-found: error

  linux-python313:
    needs: fast-validation
    name: Linux full suite (Python 3.13)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Record checked-out source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Sync locked test environment
        run: uv sync --locked --group dev --python 3.13
      - name: Install browser dependencies
        run: uv run --python 3.13 python -m playwright install chromium --with-deps
      - name: Run complete Linux suite with original evidence
        run: >-
          uv run --frozen --python 3.13 python tools/check_required_terminal.py shard-run
          --platform linux --python-version 3.13 --shard-index 0 --shard-count 1
          --report-dir "$RUNNER_TEMP/ci-suite"
      - name: Retain Linux suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-suite-${{ github.run_id }}-${{ github.run_attempt }}-linux-py3.13-shard0
          path: ${{ runner.temp }}/ci-suite
          if-no-files-found: error

  suite-evidence:
    name: Complete suite evidence
    if: always()
    needs: [test, linux-python313, macos-regressions]
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every suite job
        env:
          LINUX312: ${{ needs.test.result }}
          LINUX313: ${{ needs.linux-python313.result }}
          MACOS: ${{ needs.macos-regressions.result }}
        run: test "$LINUX312" = success && test "$LINUX313" = success && test "$MACOS" = success
      - name: Download this exact run and attempt
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ci-suite-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/ci-suite-reports
          merge-multiple: false
      - name: Validate all ten complete reports
        run: >-
          python tools/check_required_terminal.py shard-aggregate
          --reports-root "$RUNNER_TEMP/ci-suite-reports"
          --expected-sha "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID"
          --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Record verified checked-out source
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  metriplane-required:
    name: Metriplane / required
    if: always()
    needs: [fast-validation, test, linux-python313, suite-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESULTS_JSON: >-
        {"fast-validation":{"result":"${{ needs.fast-validation.result }}","sha":"${{ needs.fast-validation.outputs.source_sha }}"},"test":{"result":"${{ needs.test.result }}","sha":"${{ needs.test.outputs.source_sha }}"},"linux-python313":{"result":"${{ needs.linux-python313.result }}","sha":"${{ needs.linux-python313.outputs.source_sha }}"},"suite-evidence":{"result":"${{ needs.suite-evidence.result }}","sha":"${{ needs.suite-evidence.outputs.source_sha }}"}}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate exact aggregate result
        run: >-
          python tools/check_required_terminal.py aggregate
          --terminal "Metriplane / required"
          --expected-sha "$GITHUB_SHA"
          --expected-dependency fast-validation
          --expected-dependency test
          --expected-dependency linux-python313
          --expected-dependency suite-evidence
          --results-json "$RESULTS_JSON"
