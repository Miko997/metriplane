name: External Validation

on:
  workflow_dispatch:

permissions: read-all

jobs:
  manual-runtime:
    name: Manual external runtime validation
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync locked validation environment
        run: uv sync --locked --group dev

      - name: Run manual external runtime checklist
        run: |
          set -euo pipefail
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8

          echo "External runtime validation is manual/self-hosted evidence only."
          echo "Expected runner capabilities may include ROS 2, Docker, GPU, Isaac Sim, or Omniverse."

          uv run python -m metriplane.cli doctor
          uv run python tools/check_ros2_adapters.py

          if command -v docker >/dev/null 2>&1; then
            docker --version
          else
            echo "Docker not available on this self-hosted runner."
          fi

          if [ -f /opt/ros/jazzy/setup.bash ]; then
            echo "ROS 2 Jazzy setup found. Run the documented manual ROS 2 runtime smoke for release evidence."
          else
            echo "ROS 2 Jazzy setup not found on this self-hosted runner."
          fi
