name: Apply dependency pinning patch

on:
  push:
    branches:
      - security/pin-runtime-dependencies
    paths:
      - .github/workflows/apply-scorecard-pinning.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage dependency pinning patch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact dependency-pinning edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "docker/Dockerfile",
              "FROM python:3.12-slim-bookworm\n",
              "# Immutable manifest-list digest; Dependabot keeps the reference current.\n"
              "FROM python:3.12-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2\n",
          )

          replace_once(
              "docker/jetson.Dockerfile",
              "ARG BASE_IMAGE=python:3.12-slim\n",
              "# Keep the portable default immutable. Hardware-specific overrides should also\n"
              "# use a tag plus manifest digest: image:tag@sha256:<digest>.\n"
              "ARG BASE_IMAGE=python:3.12-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36\n",
          )

          old_health = '''health_compact() {
            curl -fsS "$HEALTH_URL" 2>/dev/null | python - <<'PY' || true
          import sys, json
          try:
            d = json.load(sys.stdin)
            overall = d.get("overall")
            comps = d.get("components", {}) or {}
            cam0 = (comps.get("camera.cam0") or {}).get("status")
            cam1 = (comps.get("camera.cam1") or {}).get("status")
            ws   = (comps.get("ws.send") or {}).get("status")
            print(f"overall={overall} cam0={cam0} cam1={cam1} ws={ws}")
          except Exception:
            print("(health not ready)")
          PY
          }
          '''
          old_health = "\n".join(line[10:] if line.startswith("          ") else line for line in old_health.splitlines()) + "\n"

          new_health = '''health_compact() {
            python - "$HEALTH_URL" <<'PY' || true
          import json
          import sys
          from urllib.request import urlopen

          try:
            with urlopen(sys.argv[1], timeout=2.0) as response:
              d = json.load(response)
            overall = d.get("overall")
            comps = d.get("components", {}) or {}
            cam0 = (comps.get("camera.cam0") or {}).get("status")
            cam1 = (comps.get("camera.cam1") or {}).get("status")
            ws   = (comps.get("ws.send") or {}).get("status")
            print(f"overall={overall} cam0={cam0} cam1={cam1} ws={ws}")
          except Exception:
            print("(health not ready)")
          PY
          }
          '''
          new_health = "\n".join(line[10:] if line.startswith("          ") else line for line in new_health.splitlines()) + "\n"
          replace_once("tools/mp.sh", old_health, new_health)

          test_path = Path("tests/test_supply_chain_pinning.py")
          if test_path.exists():
              raise SystemExit(f"refusing to replace existing {test_path}")
          test_path.write_text(
              '''# SPDX-FileCopyrightText: 2025-2026 Miko Parkkinen
          # SPDX-License-Identifier: MIT

          from pathlib import Path
          import re


          ROOT = Path(__file__).resolve().parents[1]
          DIGEST_REF = re.compile(r"^[^\\s]+@sha256:[0-9a-f]{64}$")


          def test_runtime_container_bases_are_immutable() -> None:
              dockerfile = (ROOT / "docker" / "Dockerfile").read_text(encoding="utf-8")
              primary_from = next(
                  line.removeprefix("FROM ").strip()
                  for line in dockerfile.splitlines()
                  if line.startswith("FROM ")
              )
              assert DIGEST_REF.fullmatch(primary_from)

              jetson = (ROOT / "docker" / "jetson.Dockerfile").read_text(encoding="utf-8")
              base_arg = next(
                  line.split("=", 1)[1].strip()
                  for line in jetson.splitlines()
                  if line.startswith("ARG BASE_IMAGE=")
              )
              assert DIGEST_REF.fullmatch(base_arg)


          def test_health_probe_does_not_pipe_network_content_to_an_interpreter() -> None:
              helper = (ROOT / "tools" / "mp.sh").read_text(encoding="utf-8")
              assert 'curl -fsS "$HEALTH_URL"' not in helper
              assert 'python - "$HEALTH_URL"' in helper
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          Path(".github/workflows/apply-scorecard-pinning.yml").unlink()

      - name: Validate patch
        run: |
          set -euo pipefail
          bash -n tools/mp.sh
          python -m compileall -q tests/test_supply_chain_pinning.py
          python - <<'PY'
          from tests.test_supply_chain_pinning import (
              test_health_probe_does_not_pipe_network_content_to_an_interpreter,
              test_runtime_container_bases_are_immutable,
          )

          test_runtime_container_bases_are_immutable()
          test_health_probe_does_not_pipe_network_content_to_an_interpreter()
          PY
          git diff --check

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/Dockerfile docker/jetson.Dockerfile tools/mp.sh tests/test_supply_chain_pinning.py .github/workflows/apply-scorecard-pinning.yml
          git commit -m "Pin immutable runtime inputs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
