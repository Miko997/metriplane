name: Main Health Deep
run-name: Main Health Deep / ${{ github.event.action || github.event.schedule }} / main

on:
  repository_dispatch:
    types: [main-health-nightly, main-health-weekly]
  schedule:
    - cron: "23 3 * * 1-6"
    - cron: "23 3 * * 0"

concurrency:
  group: main-health-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    if: >-
      github.event.action == 'main-health-nightly' ||
      github.event.schedule == '23 3 * * 1-6'
    name: Main health deep / nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact provider SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.0"

      - name: Run nightly full product check
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv sync --locked --group dev
          uv run python -m playwright install chromium --with-deps
          uv run python -m pytest -q

  weekly:
    if: >-
      github.event.action == 'main-health-weekly' ||
      github.event.schedule == '23 3 * * 0'
    name: Main health deep / weekly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact provider SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.0"

      - name: Run weekly full product check
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv sync --locked --group dev
          uv run python -m playwright install chromium --with-deps
          uv run python -m pytest -q
