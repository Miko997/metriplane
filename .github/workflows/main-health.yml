              str(run.get("id")) == run_id
              and run.get("event") == "repository_dispatch"
              and str(run.get("run_attempt")) == run_attempt
              and run.get("status") == "in_progress"
              and run.get("conclusion") is None
              and run.get("head_branch") == "main"
              and run.get("path")
              in {
                  ".github/workflows/main-health-lease.yml",
                  ".github/workflows/main-health-lease.yml@main",
              }
              and run.get("display_title") == expected_title
              and run.get("actor", {}).get("login") == publisher
              and run.get("triggering_actor", {}).get("login") == publisher
              and len(matching_jobs) == 1
              and matching_jobs[0].get("status") == "in_progress"
              and matching_jobs[0].get("conclusion") is None
              and len(active_steps) == 1
              and active_steps[0].get("status") == "in_progress"
