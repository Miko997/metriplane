              jq -e \
                --arg external_id "$external_id" \
                --argjson check_run_id "$check_run_id" \
                '.id == $check_run_id and .external_id == $external_id and
                 .status == "completed" and .conclusion == "failure"' \
                "$current" >/dev/null || { publish_failed=1; break; }
              jq -cn \
                --arg external_id "$external_id" \
                --arg head_sha "$lease_sha" \
                --argjson check_run_id "$check_run_id" \
                '{check_run_id:$check_run_id,external_id:$external_id,head_sha:$head_sha}' \
                >> "$active_successes"
              published="$RUNNER_TEMP/main-health-success-${lease_sha}.json"
              if ! set_main_health_check \
                "$lease_sha" success "$external_id" \
                "Main health admission passed" \
                "Admission is valid until ${deadline}." > "$published" || \
                ! jq -e \
                  --arg external_id "$external_id" \
                  --argjson check_run_id "$check_run_id" \
                  '.id == $check_run_id and .external_id == $external_id and
                   .status == "completed" and .conclusion == "success"' \
                  "$published" >/dev/null; then
                publish_failed=1
                break
              fi
            done < "$leases"
            if [[ "$publish_failed" != 0 ]]; then
              exit 1
            fi

            verify_closer_run 1 "$closer_run_1" "$closer_attempt_1"
            verify_closer_run 2 "$closer_run_2" "$closer_attempt_2"
            while true; do
              clock="$(python tools/stop_the_line.py github-provider-clock)"
              provider_epoch="$(jq -er '.epoch' <<<"$clock")"
              if (( provider_epoch >= deadline_epoch )); then
                break
              fi
              remaining=$((deadline_epoch - provider_epoch))
              if (( remaining > 15 )); then
                remaining=15
              fi
              sleep "$remaining"
            done
            while IFS= read -r active; do
              active_sha="$(jq -er '.head_sha' <<<"$active")"
              active_check_run_id="$(jq -er '.check_run_id' <<<"$active")"
              active_external_id="$(jq -er '.external_id' <<<"$active")"
              expire_main_health_check \
                "$active_sha" "$active_check_run_id" "$active_external_id" \
                "Main health admission expired" \
                "The shared provider deadline elapsed." >/dev/null
            done < "$active_successes"
          fi
          cleanup_armed=false

  main-health-required:
    name: Main health / required
    if: >-
      always() &&
      ((github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    needs:
      - scheduled-deep
      - persist-health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PERSIST_RESULT: ${{ needs.persist-health.result }}
      PERSIST_SHA: ${{ needs.persist-health.outputs.measured_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Validate exact main-health terminal result
        shell: bash
        run: |
          set -euo pipefail
          dependency=persist-health
          result="$PERSIST_RESULT"
          measured_sha="$PERSIST_SHA"
          results="$(python - "$dependency" "$result" "$measured_sha" <<'PY'
          import json
          import sys

          name, result, sha = sys.argv[1:]
          print(json.dumps({name: {"result": result, "sha": sha}}, separators=(",", ":")))
          PY
          )"
          set +e
          python tools/check_required_terminal.py aggregate \
            --terminal "Main health / required" \
            --expected-sha "$GITHUB_SHA" \
            --expected-dependency "$dependency" \
            --results-json "$results"
          aggregate_status=$?
          set -e
          exit "$aggregate_status"
