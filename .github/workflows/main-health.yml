          : > "$leases"
          : > "$active_successes"
          cleanup_armed=true
          cleanup_successes() {
            local exit_code="$?"
            trap - EXIT INT TERM
            if [[ "$cleanup_armed" == true && -s "$active_successes" ]]; then
              while IFS= read -r active; do
                active_sha="$(jq -er '.head_sha' <<<"$active")" || continue
                active_check_run_id="$(jq -er '.check_run_id' <<<"$active")" || continue
