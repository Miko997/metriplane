                    ! latest_context_status "$lease_sha" "$prefix / armed" "$armed" || \
                    [[ ! -s "$anchor" || ! -s "$armed" ]] || \
                    ! lease_marker_binding "$anchor" "$armed" "$lease_sha" \
                      "$prefix / anchor" "$prefix / armed" > "$binding"; then
                    ready=false
                    break 2
                  fi
                done
              done < "$leases"
              if [[ "$ready" == true ]]; then
                lease_ready=true
                break
              fi
              sleep 5
            done
            if [[ "$lease_ready" != true ]]; then
              while IFS= read -r lease; do
                lease_sha="$(jq -er '.head_sha' <<<"$lease")" || continue
                post_main_health_status "$lease_sha" failure \
                  "Main health lease closers did not arm" || true
              done < "$leases"
              exit 1
            fi

            closer_run_1=""
            closer_run_2=""
            for replica in 1 2; do
              closer_run=""
              while IFS= read -r lease; do
                lease_sha="$(jq -er '.head_sha' <<<"$lease")"
                IFS=$'\t' read -r marker_run _deadline _deadline_epoch \
                  < "$markers/${lease_sha}-${replica}.tsv"
                if [[ -z "$closer_run" ]]; then
                  closer_run="$marker_run"
                else
                  [[ "$marker_run" == "$closer_run" ]]
                fi
              done < "$leases"
              verify_closer_run "$replica" "$closer_run"
              printf -v "closer_run_${replica}" '%s' "$closer_run"
            done
            [[ -n "$closer_run_1" && -n "$closer_run_2" && \
              "$closer_run_1" != "$closer_run_2" ]]

            publish_failed=0
            while IFS= read -r lease; do
              lease_sha="$(jq -er '.head_sha' <<<"$lease")" || { publish_failed=1; break; }
              IFS=$'\t' read -r _run_1 deadline_1 deadline_epoch_1 \
                < "$markers/${lease_sha}-1.tsv"
              IFS=$'\t' read -r _run_2 deadline_2 deadline_epoch_2 \
                < "$markers/${lease_sha}-2.tsv"
              if (( deadline_epoch_1 <= deadline_epoch_2 )); then
                deadline="$deadline_1"
                deadline_epoch="$deadline_epoch_1"
              else
                deadline="$deadline_2"
                deadline_epoch="$deadline_epoch_2"
              fi
              clock="$(github_provider_clock)" || { publish_failed=1; break; }
              IFS=$'\t' read -r _provider_now provider_epoch <<<"$clock"
              if (( deadline_epoch - provider_epoch < 60 )); then
                post_main_health_status "$lease_sha" failure \
                  "Main health lease activation window expired" || true
                publish_failed=1
                break
              fi
              verify_closer_run 1 "$closer_run_1" || { publish_failed=1; break; }
              verify_closer_run 2 "$closer_run_2" || { publish_failed=1; break; }
              jq -cn --arg head_sha "$lease_sha" '{head_sha:$head_sha}' \
                >> "$active_successes"
              if ! post_main_health_status "$lease_sha" success \
                "Main health admission passed until ${deadline}" "$deadline"; then
                publish_failed=1
                break
              fi
            done < "$leases"
            if [[ "$publish_failed" != 0 ]]; then
              exit 1
            fi
          fi
          cleanup_armed=false

  main-health-required:
    name: Main health / required
    if: >-
      always() &&
      ((github.event_name == 'schedule' && github.event.schedule != '*/5 * * * *') ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    needs:
      - scheduled-deep
      - persist-health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PERSIST_RESULT: ${{ needs.persist-health.result }}
      PERSIST_SHA: ${{ needs.persist-health.outputs.measured_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Validate exact main-health terminal result
        shell: bash
        run: |
          set -euo pipefail
          dependency=persist-health
          result="$PERSIST_RESULT"
          measured_sha="$PERSIST_SHA"
          results="$(python - "$dependency" "$result" "$measured_sha" <<'PY'
          import json
          import sys

          name, result, sha = sys.argv[1:]
          print(json.dumps({name: {"result": result, "sha": sha}}, separators=(",", ":")))
          PY
          )"
          set +e
          python tools/check_required_terminal.py aggregate \
            --terminal "Main health / required" \
            --expected-sha "$GITHUB_SHA" \
            --expected-dependency "$dependency" \
            --results-json "$results"
          aggregate_status=$?
          set -e
          exit "$aggregate_status"
