camera_backend: usb_multi
vision_backend: aruco
target_fps: 30

# keep IDs alive briefly if one camera occludes
object_timeout_s: 1.0

metrics_host: 127.0.0.1
metrics_port: 8000

ws_host: 127.0.0.1
ws_port: 8765

profile: board_110x40_warehouse_story_v1

# 2 cameras
cameras:
  cam0: 0
  cam1: 1

# Put these files under calib/profiles/<profile>/
intrinsics:
  cam0: calib/profiles/board_110x40_warehouse_story_v1/camera_cam0.yaml
  cam1: calib/profiles/board_110x40_warehouse_story_v1/camera_cam1.yaml

mapping:
  cam0: calib/profiles/board_110x40_warehouse_story_v1/mapping_cam0.yaml
  cam1: calib/profiles/board_110x40_warehouse_story_v1/mapping_cam1.yaml

fusion:
  method: kalman        # avg | weighted | kalman
  meas_sigma: 0.03      # meters
  process_sigma: 0.8    # ~accel noise (m/s^2)
  timeout_s: 2.0
  z_world: 0.0

# record fused + raw per camera
record_jsonl: evidence/sessions/m8_fusion_live_001.jsonl

# Optional filtering for cleaner demos
exclude_marker_ids: [12, 18, 27, 42]
