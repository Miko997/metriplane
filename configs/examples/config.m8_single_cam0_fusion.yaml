camera_backend: usb_multi
vision_backend: aruco
target_fps: 30
profile: board_110x40_warehouse_story_v1_fusion

cameras:
  - name: cam0
    index: 0

fusion_method: kalman
fusion:
  method: kalman
  meas_sigma: 0.03
