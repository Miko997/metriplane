profile: board_55x40_warehouse_story_v1_fusion
target_fps: 300
object_timeout_s: 1.0
ws_host: 127.0.0.1
ws_port: 8765
metrics_host: 127.0.0.1
metrics_port: 8000
cameras:
- name: cam0
  device: /dev/v4l/by-id/usb-XIFT_Streaming_Webcams_2025072203-video-index0
  mapping_file: calib/profiles/board_55x40_warehouse_story_v1_fusion/cam0/mapping_raw.yaml
- name: cam1
  device: /dev/v4l/by-id/usb-SunplusIT_Inc_HP_320_FHD_Webcam_YJGD325HP20211201V0-video-index0
  mapping_file: calib/profiles/board_55x40_warehouse_story_v1_fusion/cam1/mapping_raw.yaml
exclude_marker_ids:
- 0
- 1
- 2
- 3
fusion:
  sync_window_s: 0.10        # 50ms (reasonable for USB cam skew)
  skip_stale_cams: false     # DO NOT skip detect/map in timing runs
  method: kalman
  meas_sigma: 0.03
  process_sigma: 0.8
record_jsonl: /tmp/fusion_health_mirror.jsonl
health:
  enabled: true
